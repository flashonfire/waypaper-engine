[package]
name = "waypaper_engine_daemon"
version = "0.1.0"
authors = ["FlashOnFire"]
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bitflags = "2.13.2"
cgmath = "0.18.0"
ffmpeg-next = { version = "9.1.0" }
fps_counter = "3.0.0"
gl = "0.14.0"
image = "0.25.10"
khronos-egl = { version = "6.0.0", features = ["dynamic"] }
libloading = "0.8.9"  # must match khronos-egl 6 (libloading 0.8)
linux-ipc = "0.2.1"
lz4_flex = "0.14.1"
ndarray = "0.17.2"
num_enum = "0.7.6"
num_enum_derive = "0.7.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-this-or-that = "0.5.0"
smithay-client-toolkit = "0.21.1"
tikv-jemallocator = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wayland-egl = "0.32.11"
waypaper_engine_shared = { path = "../waypaper_engine_shared" }
crossbeam   = "0.8.5"
